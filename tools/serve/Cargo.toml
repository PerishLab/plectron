[package]
name = "plectron-serve"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
plumb.workspace = true
ctrlc = { version = "3", features = ["termination"] }
httpdate = "1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[dev-dependencies]
nix = { version = "0.31", features = ["signal"] }
tempfile = "3"

[lints]
workspace = true
