[package]
name = "plectron-observe"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "handoff"
path = "tests/handoff.rs"

[[test]]
name = "model"
path = "tests/model.rs"

[[test]]
name = "report"
path = "tests/report.rs"

[[test]]
name = "snap"
path = "tests/snap.rs"

[[test]]
name = "capability"
path = "tests/capability.rs"

[dependencies]
locus.workspace = true
plectron-locus.workspace = true
clap.workspace = true
plumb.workspace = true
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wait-timeout = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["resource", "signal"] }

[dev-dependencies]
fixtures.workspace = true
observe.workspace = true
plectron.workspace = true
shared.workspace = true
tempfile = "3"

[lints]
workspace = true
