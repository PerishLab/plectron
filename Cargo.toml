[workspace]
resolver = "3"
members = ["tools/observation", "crates/observe", "crates/pipeline", "crates/config", "crates/ipcengine", "tools/check", "tools/chromium", "tools/fixtures", "tools/observe", "tools/serve", "crates/textengine", "crates/machine", "crates/graphics", "crates/platform", "tools/spec", "crates/shared", "crates/grammar", "crates/cli", "crates/lib", "crates/jsengine", "crates/domengine", "crates/geoengine", "crates/jsruntime", "crates/webengine", "crates/project", "crates/pt", "crates/typescript"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
locus = { version = "0", registry = "perish" }
plectron-locus = { path = "tools/observation" }
ahash = "0.8"
clap = { version = "4.5", features = ["derive"] }
plumb = { version = "0", registry = "perish", default-features = false }
observe = { path = "crates/observe" }
pipeline = { path = "crates/pipeline" }
config = { path = "crates/config" }
ipcengine = { path = "crates/ipcengine" }
fixtures = { path = "tools/fixtures" }
textengine = { path = "crates/textengine" }
graphics = { path = "crates/graphics" }
platform = { path = "crates/platform" }
shared = { path = "crates/shared" }
grammar = { path = "crates/grammar" }
jsengine = { path = "crates/jsengine" }
plectron = { path = "crates/lib" }
domengine = { path = "crates/domengine" }
geoengine = { path = "crates/geoengine" }
jsruntime = { path = "crates/jsruntime" }
webengine = { path = "crates/webengine" }
project = { path = "crates/project" }
pt = { path = "crates/pt" }
typescript = { path = "crates/typescript" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.test]
debug = "line-tables-only"
incremental = false
