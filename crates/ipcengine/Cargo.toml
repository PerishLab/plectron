[package]
name = "ipcengine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
shared.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[target."cfg(windows)".dependencies]
interprocess = "2.4.4"
sha2 = "0.10"
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }
