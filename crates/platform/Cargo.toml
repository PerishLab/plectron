[package]
build = "src/build.rs"
name = "platform"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
graphics.workspace = true
shared.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSView", "NSResponder", "objc2-quartz-core", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFDate", "CFRunLoop"] }
objc2-foundation = "0.3.2"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CABase", "CADisplayLink", "CALayer", "CAMetalLayer", "CAMediaTiming", "objc2-core-foundation", "objc2-metal", "objc2-core-graphics"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[target."cfg(windows)".dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security"] }


[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", default-features = false, features = ["shm", "image", "resource_manager", "present", "dri3"] }
libc = "0.2"

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
