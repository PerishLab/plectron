<!doctype html>
<html><head><title>Independent panels</title><link rel="stylesheet" href="style.css"><script src="main.ts"></script></head>
<body><p class="eyebrow">PLECTRON / WORK DESK</p><h1>Independent spaces</h1>
<p>Update one panel. Scroll each region. Keep the other panel intact.</p>
<div class="toolbar"><button id="append">Add row</button><button id="edit">Edit first</button><button id="reorder">Move first</button><button id="remove">Remove first</button></div>
<div class="panels"><div class="panel"><h2>Activity</h2><input id="left-input"><div id="left"></div></div><div class="panel"><h2>Reference</h2><input id="right-input"><div id="right"></div></div></div>
<p id="status">Ready</p></body></html>
